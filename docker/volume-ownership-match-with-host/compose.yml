services:
  app:
    init: true
    build:
      context: .
      # Example: HOST_UID=$(id -u) HOST_GID=$(id -g) docker compose build app
      # optional: if you want to pass the UID and GID as build arguments, you can do it here
      # also, you can set default values in the Dockerfile using ARG
      args:
        - "UID=${HOST_UID:-1000}"
        - "GID=${HOST_GID:-1000}"
    volumes:
      - ./data:/data
